[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opnsense-agent"
version = "0.1.0"
description = "Claude Code plugin for managing OPNsense firewalls via a plan-then-apply workflow"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tyler Creighton" }]

dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "asyncssh>=2.18",
    "pyyaml>=6.0",
"click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pyright>=1.1.380",
    "pre-commit>=4.0",
]

[project.scripts]
opnsense-agent = "opnsense_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "RET", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: hits a real OPNsense (requires OPN_AGENT_INTEGRATION_TEST=1)",
]
